{% extends "bank/base.html" %}
{% load static %}
{% block title %}🏆 {{ quiz.title }}{% endblock %}
{% block content %}
<div id="quiz" class="live-page challenge-page" data-question-type="mcq_tf"
     data-title="{{ quiz.title }}" data-group="{{ group.name }}"
     data-back="{{ group.get_absolute_url }}#leaderboard"
     data-data="{% url 'bank:challenge_data' group.code challenge.pk %}"
     data-answer="{% url 'bank:challenge_answer' group.code challenge.pk %}"
     data-submit="{% url 'bank:challenge_submit' group.code challenge.pk %}"
     data-results="{% if manage %}{% url 'bank:challenge_results' group.code challenge.pk %}{% endif %}"
     data-official="{% if group.is_everyone %}1{% else %}0{% endif %}"
     data-scored="{{ scored }}" data-count="{{ quiz.questions|length }}">
  <p class="mute">Loading…</p>
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'bank/challenge.js' %}?v=20261122-1"></script>{% endblock %}
