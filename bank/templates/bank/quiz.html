{% extends "bank/base.html" %}
{% load static %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div id="quiz"
     data-key="{{ key }}" data-title="{{ title }}" data-back="{{ back }}" data-api="{{ api }}"
     data-shuffle="{{ shuffle }}"
     data-review="{% if review %}1{% else %}0{% endif %}"
     data-start-question="{{ start_question|default:'' }}"
     data-edit-api="{{ edit_api }}"
     data-can-sort="{% if can_sort %}1{% else %}0{% endif %}"
     data-sort-api="{{ sort_api }}"
     data-review-bin-api="{{ review_bin_api }}"
     data-question-type="{{ question_type|default:'' }}"
     data-user-id="{{ user.pk|default:'' }}"
     data-check="{% url 'bank:api_check' 0 %}"
     data-image-target="{% url 'bank:api_image_target' 0 0 %}"
     data-save="{% url 'bank:api_save' 0 %}"
     data-comment="{% url 'bank:api_comment' 0 %}"
     data-note="{% url 'bank:api_note' 0 %}"
     data-groups="{% if user.is_authenticated and not personal %}{% url 'bank:api_groups_postable' %}{% endif %}"
     data-group-save="{% url 'bank:api_group_save' 0 %}"
     data-personal="{% if personal %}1{% else %}0{% endif %}"
     data-live-start="{% if user.is_authenticated and not review %}{% url 'bank:live_start' %}{% endif %}"
     data-live-mine="{{ live_mine|default:'' }}"
     data-edit="{% if perms.bank.change_question and not personal %}{% url 'bank:question_edit' 0 %}?next={{ request.get_full_path|urlencode }}{% endif %}"
     data-auth="{% if user.is_authenticated %}1{% else %}0{% endif %}"
     data-activity="{% if user.is_authenticated and not personal and not review %}{% url 'bank:api_activity_answers' %}{% endif %}"
     data-login="{% url 'bank:login' %}?next={{ request.get_full_path|urlencode }}">
  <p class="mute">Loading…</p>
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'bank/quiz.js' %}?v=20261122-1"></script>{% endblock %}
