<script>
(() => {
  // Pop-up windows: [data-open="id"] opens a <dialog>, [data-close] or a tap outside closes it.
  document.addEventListener("click", e => {
    const opener = e.target.closest("[data-open]");
    if (opener) {
      const dialog = document.getElementById(opener.dataset.open);
      if (dialog && dialog.showModal) { e.preventDefault(); dialog.showModal(); dialog.querySelector("textarea, input:not([type=hidden])")?.focus(); }
      return;
    }
    if (e.target.closest("[data-close]")) { e.target.closest("dialog")?.close(); return; }
    if (e.target.tagName === "DIALOG") e.target.close();      // the backdrop
  });
  // Tabs: [data-tab] buttons show the matching [data-panel]; the choice is kept in the address (#quizzes).
  const tabs = [...document.querySelectorAll("[data-tab]")];
  if (tabs.length) {
    const show = name => {
      if (!tabs.some(t => t.dataset.tab === name)) name = tabs[0].dataset.tab;
      tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
      document.querySelectorAll("[data-panel]").forEach(p => { p.hidden = p.dataset.panel !== name; });
    };
    tabs.forEach(t => t.addEventListener("click", () => { show(t.dataset.tab); history.replaceState(null, "", "#" + t.dataset.tab); }));
    show(location.hash.slice(1));
  }
  // Reactions: update in place instead of reloading the page
  document.addEventListener("submit", async e => {
    const form = e.target.closest("form[data-react]");
    if (!form || !e.submitter) return;
    e.preventDefault();
    const data = new FormData(form);
    data.set("emoji", e.submitter.value);
    form.querySelector("details")?.removeAttribute("open");
    // getAttribute: the form has a field named "action", which hides form.action
    const url = form.getAttribute("action");
    try {
      const r = await fetch(url, {method: "POST", body: data, headers: {"X-Requested-With": "fetch"}});
      const j = await r.json();
      if (j.html) form.outerHTML = j.html;
    } catch (err) {                               // no connection or no JSON: send it the ordinary way
      const keep = document.createElement("input");
      keep.type = "hidden"; keep.name = "emoji"; keep.value = e.submitter.value;
      form.appendChild(keep);
      HTMLFormElement.prototype.submit.call(form);
    }
  });
  document.addEventListener("click", e => {      // close an open reaction picker when tapping elsewhere
    document.querySelectorAll(".gx-react-menu[open]").forEach(d => { if (!d.contains(e.target)) d.removeAttribute("open"); });
  });
  // Copy the invite link
  document.querySelectorAll("[data-copy-link]").forEach(button => button.addEventListener("click", async () => {
    const box = document.getElementById(button.dataset.copyLink);
    try { await navigator.clipboard.writeText(box.value); } catch (err) { box.select(); document.execCommand("copy"); }
    const label = button.textContent;
    button.textContent = "Copied ✓";
    setTimeout(() => button.textContent = label, 2000);
  }));
})();
</script>
